{% extends "base.html" %}

{% block title %}Xabar Yuborish | Hamroh Admin{% endblock %}
{% block header_title %}Xabar Yuborish (Broadcast){% endblock %}

{% block content %}
<div class="max-w-2xl mx-auto space-y-8" x-data="broadcastApp()" x-init="init()">

    <div class="bg-dark-card rounded-2xl p-8 shadow-xl border border-dark-border relative overflow-hidden">

        <h3 class="text-xl font-bold text-white mb-6 flex items-center gap-2">
            <span>📢</span> Ommaviy xabar
        </h3>

        <div class="space-y-6">
            <!-- Target Audience -->
            <div>
                <label class="block text-sm font-medium text-dark-muted mb-2">Kimga yuboriladi?</label>
                <select x-model="form.target" @change="fetchCount()"
                    class="w-full bg-dark-bg border border-dark-border rounded-xl p-3 text-white focus:ring-2 focus:ring-blue-500 outline-none">
                    <option value="all">Barchaga</option>
                    <option value="drivers">Faqat Haydovchilarga</option>
                    <option value="passengers">Faqat Yo'lovchilarga</option>
                </select>
                <p class="text-xs text-blue-400 mt-2 font-mono" x-show="count !== null">
                    <span x-text="count"></span> ta foydalanuvchi qabul qiladi
                </p>
            </div>

            <!-- Message Type -->
            <div>
                <label class="block text-sm font-medium text-dark-muted mb-2">Xabar turi</label>
                <div class="flex gap-4">
                    <label class="flex items-center gap-2 cursor-pointer">
                        <input type="radio" name="type" value="text" x-model="form.type"
                            class="w-4 h-4 text-blue-600 bg-dark-bg border-dark-border focus:ring-blue-500">
                        <span class="text-white text-sm">Matn</span>
                    </label>
                    <label class="flex items-center gap-2 cursor-pointer">
                        <input type="radio" name="type" value="photo" x-model="form.type"
                            class="w-4 h-4 text-blue-600 bg-dark-bg border-dark-border focus:ring-blue-500">
                        <span class="text-white text-sm">Rasm bilan</span>
                    </label>
                </div>
            </div>

            <!-- Image URL -->
            <div x-show="form.type === 'photo'" x-transition>
                <label class="block text-sm font-medium text-dark-muted mb-2">Rasm havolasi (URL)</label>
                <input type="text" x-model="form.photo_url"
                    class="w-full bg-dark-bg border border-dark-border rounded-xl p-3 text-white focus:ring-2 focus:ring-blue-500 outline-none"
                    placeholder="https://...">
            </div>

            <!-- Message Text -->
            <div>
                <label class="block text-sm font-medium text-dark-muted mb-2">Xabar matni</label>
                <textarea x-model="form.text" rows="6"
                    class="w-full bg-dark-bg border border-dark-border rounded-xl p-3 text-white focus:ring-2 focus:ring-blue-500 outline-none"
                    placeholder="Xabar matnini kiriting... (HTML format qo'llab quvvatlanadi)"></textarea>
                <p class="text-xs text-dark-muted mt-2 text-right">
                    <b>&lt;b&gt;bold&lt;/b&gt;</b>, <i>&lt;i&gt;italic&lt;/i&gt;</i>
                </p>
            </div>

            <div class="pt-4">
                <button @click="sendBroadcast()"
                    class="w-full bg-gradient-to-r from-blue-600 to-indigo-600 hover:from-blue-500 hover:to-indigo-500 text-white font-bold py-3 px-6 rounded-xl shadow-lg shadow-blue-500/30 transition-all transform hover:scale-[1.02] flex justify-center items-center gap-2"
                    :disabled="sending">
                    <span x-show="!sending">Yuborish 🚀</span>
                    <span x-show="sending">Yuborilmoqda...</span>
                </button>
            </div>
        </div>
    </div>
</div>

<script>
    function broadcastApp() {
        return {
            form: {
                target: 'all',
                type: 'text',
                photo_url: '',
                text: ''
            },
            count: null,
            sending: false,

            async init() {
                await this.fetchCount();
            },

            async fetchCount() {
                // Mock or Real endpoint to get count
                // Assuming endpoint exists or just hiding count if fails.
                try {
                    // If API supports counting target audience
                    // const res = await fetch(`/api/broadcast/count?target=${this.form.target}`);
                    // const data = await res.json();
                    // this.count = data.count;
                } catch (e) {
                    console.log("Count API not available");
                }
            },

            async sendBroadcast() {
                if (!this.form.text) return alert("Xabar matnini kiriting");

                if (!confirm("Xabarni barcha foydalanuvchilarga yuborishni tasdiqlaysizmi?")) return;

                this.sending = true;
                try {
                    const payload = {
                        message: this.form.text,
                        target: this.form.target
                    };

                    const res = await fetch('/api/broadcast/send', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(payload)
                    });
                    const data = await res.json();

                    if (data.success) {
                        alert("Xabar yuborish boshlandi!");
                        this.form.text = '';
                        this.form.photo_url = '';
                    } else {
                        alert("Xatolik: " + data.detail);
                    }
                } catch (e) {
                    alert("Server xatosi");
                } finally {
                    this.sending = false;
                }
            }
        }
    }
</script>
{% endblock %}
