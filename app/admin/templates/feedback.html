{% extends "base.html" %}

{% block title %}Murojaatlar | Hamroh Admin{% endblock %}
{% block header_title %}Murojaatlar va Takliflar{% endblock %}

{% block content %}
<div class="space-y-6" x-data="feedbackApp()" x-init="init()">

    <!-- Stats -->
    <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
        <div class="bg-dark-card p-5 rounded-2xl shadow-lg border border-dark-border">
            <p class="text-xs text-dark-muted font-medium uppercase tracking-wider">Jami murojaatlar</p>
            <p class="text-2xl font-bold text-white mt-1" x-text="stats.total || 0"></p>
        </div>
        <div class="bg-dark-card p-5 rounded-2xl shadow-lg border border-dark-border">
            <p class="text-xs text-green-400 font-medium uppercase tracking-wider">Bugun</p>
            <p class="text-2xl font-bold text-white mt-1" x-text="stats.today || 0"></p>
        </div>
        <div class="bg-dark-card p-5 rounded-2xl shadow-lg border border-dark-border">
            <p class="text-xs text-yellow-400 font-medium uppercase tracking-wider">O'qilmagan</p>
            <p class="text-2xl font-bold text-white mt-1" x-text="stats.unread || 0"></p>
        </div>
    </div>

    <!-- Filters -->
    <div class="bg-dark-card p-4 rounded-2xl shadow-lg border border-dark-border flex items-center justify-between">
        <div class="flex items-center gap-4 flex-1">
            <select x-model="filters.status" @change="fetchFeedback()"
                class="bg-dark-bg border border-dark-border rounded-xl px-3 py-2 text-sm text-white focus:ring-2 focus:ring-blue-500 outline-none">
                <option value="">Holat (Barchasi)</option>
                <option value="unread">O'qilmagan</option>
                <option value="read">O'qilgan</option>
            </select>
            <button @click="fetchFeedback()" class="text-dark-muted hover:text-white transition-colors">
                🔄 Yangilash
            </button>
        </div>
    </div>

    <!-- Feedback List -->
    <div class="grid grid-cols-1 gap-4">
        <template x-for="item in feedback" :key="item.id">
            <div class="bg-dark-card rounded-2xl p-5 shadow-lg border border-dark-border hover:border-blue-500/50 transition-colors cursor-pointer"
                :class="{'border-l-4 border-l-blue-500': !item.is_read}" @click="viewDetails(item)">
                <div class="flex justify-between items-start mb-2">
                    <div class="flex items-center gap-3">
                        <div
                            class="h-10 w-10 rounded-full bg-dark-bg flex items-center justify-center text-lg shadow-inner">
                            👤
                        </div>
                        <div>
                            <h4 class="text-white font-bold text-base" x-text="item.user?.full_name || 'Noma\'lum'">
                            </h4>
                            <p class="text-xs text-dark-muted"
                                x-text="item.user?.phone + ' • ' + (item.user_type === 'driver' ? 'Haydovchi' : 'Yo\'lovchi')">
                            </p>
                        </div>
                    </div>
                    <span class="text-xs text-dark-muted" x-text="formatDate(item.created_at)"></span>
                </div>
                <p class="text-gray-300 text-sm line-clamp-2 pl-13" x-text="item.message"></p>
            </div>
        </template>
        <template x-if="feedback.length === 0">
            <div class="text-center py-12 bg-dark-card rounded-2xl border border-dark-border">
                <p class="text-dark-muted">Murojaatlar mavjud emas</p>
            </div>
        </template>
    </div>

    <!-- Details Modal -->
    <div x-show="modals.details" class="fixed inset-0 z-50 overflow-y-auto" x-cloak>
        <div class="flex items-center justify-center min-h-screen p-4">
            <div class="fixed inset-0 bg-black/70 backdrop-blur-sm" @click="modals.details = false"></div>
            <div class="bg-dark-card rounded-2xl p-6 max-w-2xl w-full relative border border-dark-border shadow-2xl">
                <button @click="modals.details = false"
                    class="absolute top-4 right-4 text-gray-400 hover:text-white text-2xl">&times;</button>

                <template x-if="selectedItem">
                    <div>
                        <div class="flex items-center gap-4 mb-6">
                            <div
                                class="h-14 w-14 rounded-full bg-blue-500/10 flex items-center justify-center text-2xl text-blue-400 border border-blue-500/20">
                                📝
                            </div>
                            <div>
                                <h3 class="text-xl font-bold text-white mb-1" x-text="selectedItem.user?.full_name">
                                </h3>
                                <p class="text-sm text-dark-muted"
                                    x-text="selectedItem.user?.phone + ' | ' + formatDate(selectedItem.created_at)"></p>
                            </div>
                        </div>

                        <div class="bg-dark-bg p-4 rounded-xl border border-dark-border mb-6">
                            <p class="text-gray-200 whitespace-pre-wrap leading-relaxed" x-text="selectedItem.message">
                            </p>
                        </div>

                        <div class="flex justify-end gap-3">
                            <a :href="'tel:' + selectedItem.user?.phone"
                                class="bg-green-600 hover:bg-green-500 text-white px-4 py-2 rounded-xl text-sm font-medium transition-colors shadow-lg shadow-green-500/20">
                                📞 Qo'ng'iroq qilish
                            </a>
                            <template x-if="!selectedItem.is_read">
                                <button @click="markAsRead(selectedItem.id)"
                                    class="bg-blue-600 hover:bg-blue-500 text-white px-4 py-2 rounded-xl text-sm font-medium transition-colors shadow-lg shadow-blue-500/20">
                                    ✅ O'qildi deb belgilash
                                </button>
                            </template>
                        </div>
                    </div>
                </template>
            </div>
        </div>
    </div>

    <!-- Pagination -->
    <div class="flex justify-center mt-6">
        <button @click="loadMore()" x-show="hasMore"
            class="bg-dark-card hover:bg-dark-hover text-white px-6 py-2 rounded-xl border border-dark-border transition-colors">
            Yana yuklash...
        </button>
    </div>

</div>

<script>
    function feedbackApp() {
        return {
            feedback: [],
            stats: {},
            filters: {
                status: '',
                limit: 20,
                offset: 0
            },
            hasMore: true,
            selectedItem: null,
            modals: { details: false },

            async init() {
                await this.fetchStats();
                await this.fetchFeedback();
            },

            async fetchStats() {
                const data = await this.apiCall('/api/feedback/stats');
                if (data) this.stats = data;
            },

            async fetchFeedback(append = false) {
                if (!append) {
                    this.filters.offset = 0;
                    this.feedback = [];
                    this.hasMore = true;
                }

                let url = `/api/feedback/?limit=${this.filters.limit}&offset=${this.filters.offset}`;
                if (this.filters.status) url += `&status=${this.filters.status}`;

                const data = await this.apiCall(url);
                if (data) {
                    if (append) {
                        this.feedback = [...this.feedback, ...data.items];
                    } else {
                        this.feedback = data.items;
                    }

                    if (data.items.length < this.filters.limit) {
                        this.hasMore = false;
                    }
                }
            },

            async loadMore() {
                this.filters.offset += this.filters.limit;
                await this.fetchFeedback(true);
            },

            viewDetails(item) {
                this.selectedItem = item;
                this.modals.details = true;
                if (!item.is_read) {
                    // Avtomatik o'qilgan deb belgilash (serverga so'rov yuborish mumkin)
                }
            },

            async markAsRead(id) {
                const res = await this.apiCall(`/api/feedback/${id}/read`, 'PUT');
                if (res && res.success) {
                    this.selectedItem.is_read = true;
                    const idx = this.feedback.findIndex(x => x.id === id);
                    if (idx !== -1) this.feedback[idx].is_read = true;
                    this.fetchStats();
                    this.modals.details = false;
                }
            },

            async apiCall(url, method = 'GET', body = null) {
                try {
                    const options = {
                        method,
                        headers: { 'Content-Type': 'application/json' }
                    };
                    if (body) options.body = JSON.stringify(body);

                    const res = await fetch(url, options);
                    return await res.json();
                } catch (e) {
                    console.error(e);
                    return null;
                }
            },

            formatDate(iso) {
                if (!iso) return '-';
                return new Date(iso).toLocaleString('uz-UZ', { day: '2-digit', month: '2-digit', year: 'numeric', hour: '2-digit', minute: '2-digit' });
            }
        }
    }
</script>
{% endblock %}
