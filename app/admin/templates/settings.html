{% extends "base.html" %}

{% block title %}Sozlamalar | Hamroh Admin{% endblock %}
{% block header_title %}Tizim Sozlamalari{% endblock %}

{% block content %}
<div class="max-w-4xl mx-auto space-y-8" x-data="settingsApp()" x-init="init()">

    <!-- Dynamic Settings Form -->
    <div class="bg-dark-card rounded-2xl p-8 shadow-xl border border-dark-border relative overflow-hidden">
        <h3 class="text-xl font-bold text-white mb-6 flex items-center gap-2">
            <span>⚙️</span> Tizim Konfiguratsiyasi
        </h3>

        <div class="space-y-6">
            <template x-if="loading">
                <div class="text-center text-dark-muted py-8">Yuklanmoqda...</div>
            </template>

            <template x-for="(value, key) in settings" :key="key">
                <div class="grid grid-cols-1 md:grid-cols-2 gap-4 items-center border-b border-dark-border pb-4 last:border-0"
                    x-show="!['environment', 'is_production', 'working_hours', 'support_phone', 'support_username'].includes(key)">

                    <!-- Label & Description -->
                    <div class="pr-4">
                        <label class="block text-sm font-bold text-gray-200 mb-1" x-text="getMeta(key).title"></label>
                        <p class="text-xs text-dark-muted" x-text="getMeta(key).description"></p>
                    </div>

                    <!-- Input & Save -->
                    <div class="flex items-center gap-2">

                        <!-- Boolean (Toggle) -->
                        <template x-if="getMeta(key).type === 'boolean'">
                            <button @click="toggleSetting(key, $event)"
                                class="relative inline-flex h-6 w-11 flex-shrink-0 cursor-pointer rounded-full border-2 border-transparent transition-colors duration-200 ease-in-out focus:outline-none"
                                :class="String(settings[key]) === 'true' ? 'bg-green-500' : 'bg-dark-border'">
                                <span class="sr-only">Use setting</span>
                                <span aria-hidden="true"
                                    class="pointer-events-none inline-block h-5 w-5 transform rounded-full bg-white shadow ring-0 transition duration-200 ease-in-out"
                                    :class="String(settings[key]) === 'true' ? 'translate-x-5' : 'translate-x-0'">
                                </span>
                            </button>
                        </template>

                        <!-- Number -->
                        <template x-if="getMeta(key).type === 'number'">
                            <input type="number" x-model="settings[key]" step="any"
                                class="flex-1 bg-dark-bg border border-dark-border rounded-lg p-2 text-white focus:ring-2 focus:ring-blue-500 outline-none">
                        </template>

                        <!-- Text (Default) -->
                        <template x-if="getMeta(key).type === 'text'">
                            <input type="text" x-model="settings[key]"
                                class="flex-1 bg-dark-bg border border-dark-border rounded-lg p-2 text-white focus:ring-2 focus:ring-blue-500 outline-none">
                        </template>

                        <button @click="saveSetting(key, $event)"
                            class="bg-blue-600 hover:bg-blue-500 text-white p-2 rounded-lg text-sm shadow-lg transition-all"
                            title="Saqlash">
                            💾
                        </button>
                    </div>
                </div>
            </template>
        </div>
    </div>
</div>

<script>
    function settingsApp() {
        return {
            settings: {},
            loading: true,

            // Metadata for settings descriptions and types
            settingsMetadata: {
                'commission_amount': { title: 'Komissiya Miqdori', description: 'Har bir buyurtmadan olinadigan to\'lov (so\'mda).', type: 'number' },
                'bot_is_free': { title: 'Bot bepulmi?', description: 'Agar true bo\'lsa, komissiya olinmaydi.', type: 'boolean' },
                'ban_percentage_threshold': { title: 'Ban foizi (Limit)', description: 'Haydovchi qancha foiz buyurtmani bekor qilsa ban oladi (%).', type: 'number' },
                'ban_count_threshold': { title: 'Ban Soni (Limit)', description: 'Nechta bekor qilishdan keyin tekshiruv boshlanadi.', type: 'number' },
                'max_driver_change_per_hour': { title: 'Haydovchi Almashtirish Limiti', description: 'Yo\'lovchi bir soatda necha marta haydovchini almashtirishi mumkin.', type: 'number' },
                'max_pickup_distance_km': { title: 'Buyurtma Masofasi (KM)', description: 'Haydovchi qancha masofadagi buyurtmalarni ko\'radi.', type: 'number' },
                'auto_confirm_delay_seconds': { title: 'Avto Tasdiqlash Kechikishi', description: 'Buyurtma qabul qilingandan keyin tasdiqlash uchun kutiladigan vaqt.', type: 'number' },
                'sms_rate_limit_per_day': { title: 'SMS Limit (Kunlik)', description: 'Bir kunda bitta raqamga yuboriladigan maksimal SMS.', type: 'number' },
                'sms_rate_limit_per_hour': { title: 'SMS Limit (Soatlik)', description: 'Bir soatda bitta raqamga yuboriladigan maksimal SMS.', type: 'number' },
                'max_driver_rejects_per_day': { title: 'Haydovchi Rad Etish Limiti', description: 'Kunlik bekor qilishlar limiti.', type: 'number' },
                'driver_inactivity_threshold': { title: 'Nofaollik chegarasi (Kun)', description: 'Haydovchi nechi kun kirmasa nofaol hisoblanadi.', type: 'number' },
                'auto_complete_trip_seconds': { title: 'Avto Yakunlash (Sonita)', description: 'Safar boshlangandan keyin avtomatik tugatish vaqti.', type: 'number' },
                'auto_reject_order_seconds': { title: 'Avto Bekor Qilish (Soniya)', description: 'Haydovchi topilmasa buyurtmani bekor qilish vaqti.', type: 'number' },
                'auto_confirm_trip_seconds': { title: 'Avto Tasdiqlash (Trip)', description: 'Safar yakunlanganda avtomatik tasdiqlash vaqti.', type: 'number' },
                'driver_matching_timeout_seconds': { title: 'Haydovchi Qidirish Vaqti', description: 'Buyurtmaga haydovchi qidirish maksimal vaqti.', type: 'number' },
                'driver_matching_max_retries': { title: 'Qidirish Urinishlari', description: 'Haydovchi topilmasa qayta urinishlar soni.', type: 'number' },
                'driver_matching_retry_delay_seconds': { title: 'Qayta Urinish Kechikishi', description: 'Har bir urinish orasidagi vaqt (soniya).' },
                'auto_start_trip_delay_seconds': { title: 'Avto Boshlash Kechikishi', description: 'Haydovchi yetib kelgach safarni avtomatik boshlash vaqti.', type: 'number' },
                'task_retry_delay_seconds': { title: 'Vazifa Qayta Urinish', description: 'Celery vazifalari xato bersa qayta urinish vaqti.', type: 'number' },
                'order_lock_timeout_seconds': { title: 'Buyurtma Bloklash Vaqti', description: 'Buyurtmani tahrirlashda bloklash vaqti.', type: 'number' },
                'generic_lock_timeout_seconds': { title: 'Umumiy Bloklash', description: 'Tizim bo\'yicha umumiy bloklash vaqti.', type: 'number' },
                'state_ttl_seconds': { title: 'Holatni Saqlash (TTL)', description: 'Redisda foydalanuvchi holati qancha turishi (soniya).' },
                'onboarding_video_1_id': { title: 'Video Qo\'llanma 1 (ID)', description: 'Start bosilganda yuboriladigan 1-video ID (file_id).', type: 'text' },
                'onboarding_video_2_id': { title: 'Video Qo\'llanma 2 (ID)', description: 'Start bosilganda yuboriladigan 2-video ID (file_id).', type: 'text' }
            },

            async init() {
                await this.fetchSettings();
            },

            async fetchSettings() {
                this.loading = true;
                try {
                    const res = await fetch(rootedUrl('/api/settings/'));
                    const data = await res.json();
                    if (data.success) {
                        this.settings = data.settings;
                    }
                } catch (e) {
                    console.error(e);
                } finally {
                    this.loading = false;
                }
            },

            getMeta(key) {
                const meta = this.settingsMetadata[key] || {
                    title: this.formatLabel(key),
                    description: key
                };
                // Ensure type defaults to 'text' if not specified
                return {
                    ...meta,
                    type: meta.type || 'text'
                };
            },

            toggleSetting(key, event) {
                // Toggle between 'true' and 'false' strings (since settings values are strings)
                const current = String(this.settings[key]) === 'true';
                this.settings[key] = String(!current);

                // Optional: Auto-save on toggle? Let's stick to manual save for now for consistency,
                // or we can pass event to saveSetting if needed.
                // However, the user might expect a toggle to save immediately ?
                // The Save button is still there.Let's keep manual save to avoid accidental changes?
                // Actually, toggles usually save immediately or have a save button. 
                // Given existing UI has a save button next to it, let's keep using that.
            },

            async saveSetting(key, event) {
                try {
                    const btn = event ? event.currentTarget : null;
                    const payload = { value: String(this.settings[key]) };

                    const res = await fetch(rootedUrl(`/api/settings/${key}`), {
                        method: 'PUT',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(payload)
                    });
                    const data = await res.json();

                    if (data.success) {
                        if (btn) {
                            const originalHTML = btn.innerHTML;
                            btn.innerHTML = '✅';
                            setTimeout(() => btn.innerHTML = originalHTML, 1500);
                        } else {
                            alert("Saqlandi!");
                        }
                    } else {
                        alert("Xatolik: " + (data.detail || data.message));
                    }
                } catch (e) {
                    alert("Xatolik yuz berdi: " + e.message);
                }
            },

            formatLabel(key) {
                return key.split('_').map(word => word.charAt(0).toUpperCase() + word.slice(1)).join(' ');
            }
        }
    }
</script>
{% endblock %}
