{% extends "base.html" %}

{% block title %}Adminlar | Hamroh Admin{% endblock %}
{% block header_title %}Adminlarni Boshqarish{% endblock %}

{% block content %}
<div class="space-y-6" x-data="adminsApp()" x-init="init()">

    <!-- Header Actions -->
    <div class="flex justify-end mb-4">
        <button @click="openModal()"
            class="bg-blue-600 hover:bg-blue-500 text-white px-5 py-2 rounded-xl text-sm font-bold shadow-lg shadow-blue-500/20 transition-all flex items-center gap-2">
            <span>+</span> Yangi Admin
        </button>
    </div>

    <!-- Admins Table -->
    <div class="bg-dark-card rounded-2xl shadow-lg border border-dark-border overflow-hidden">
        <div class="overflow-x-auto">
            <table class="min-w-full divide-y divide-dark-border">
                <thead class="bg-dark-bg/50">
                    <tr>
                        <th class="px-6 py-4 text-left text-xs font-medium text-dark-muted uppercase tracking-wider">ID
                        </th>
                        <th class="px-6 py-4 text-left text-xs font-medium text-dark-muted uppercase tracking-wider">
                            Username</th>
                        <th class="px-6 py-4 text-left text-xs font-medium text-dark-muted uppercase tracking-wider">
                            To'liq ism</th>
                        <th class="px-6 py-4 text-left text-xs font-medium text-dark-muted uppercase tracking-wider">
                            Role</th>
                        <th class="px-6 py-4 text-left text-xs font-medium text-dark-muted uppercase tracking-wider">
                            Status</th>
                        <th class="px-6 py-4 text-right text-xs font-medium text-dark-muted uppercase tracking-wider">
                            Amallar</th>
                    </tr>
                </thead>
                <tbody class="divide-y divide-dark-border">
                    <template x-for="admin in admins" :key="admin.id">
                        <tr class="hover:bg-dark-hover/50 transition-colors">
                            <td class="px-6 py-4 whitespace-nowrap text-sm text-dark-muted" x-text="admin.id"></td>
                            <td class="px-6 py-4 whitespace-nowrap text-sm font-medium text-white"
                                x-text="admin.username"></td>
                            <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-300" x-text="admin.full_name"></td>
                            <td class="px-6 py-4 whitespace-nowrap">
                                <span
                                    class="px-2 inline-flex text-xs leading-5 font-semibold rounded-full bg-purple-500/10 text-purple-400 border border-purple-500/20"
                                    x-text="admin.role"></span>
                            </td>
                            <td class="px-6 py-4 whitespace-nowrap">
                                <span class="px-2 inline-flex text-xs leading-5 font-semibold rounded-full"
                                    :class="admin.is_active ? 'bg-green-500/10 text-green-400' : 'bg-red-500/10 text-red-400'"
                                    x-text="admin.is_active ? 'Active' : 'Inactive'"></span>
                            </td>
                            <td class="px-6 py-4 whitespace-nowrap text-right text-sm font-medium space-x-2">
                                <button @click="deleteAdmin(admin.id)"
                                    class="text-red-400 hover:text-red-300 transition-colors">O'chirish</button>
                            </td>
                        </tr>
                    </template>
                </tbody>
            </table>
        </div>
    </div>

    <!-- Create Admin Modal -->
    <div x-show="modals.form" class="fixed inset-0 z-50 overflow-y-auto" x-cloak>
        <div class="flex items-center justify-center min-h-screen p-4">
            <div class="fixed inset-0 bg-black/70 backdrop-blur-sm" @click="modals.form = false"></div>
            <div class="bg-dark-card rounded-2xl p-6 max-w-md w-full relative border border-dark-border shadow-2xl">
                <h3 class="text-xl font-bold text-white mb-6">Yangi Admin qo'shish</h3>

                <div class="space-y-4">
                    <div>
                        <label class="block text-sm font-medium text-dark-muted mb-1">Username</label>
                        <input type="text" x-model="form.username"
                            class="w-full bg-dark-bg border border-dark-border rounded-xl p-3 text-white focus:ring-2 focus:ring-blue-500 outline-none">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-dark-muted mb-1">To'liq ism</label>
                        <input type="text" x-model="form.full_name"
                            class="w-full bg-dark-bg border border-dark-border rounded-xl p-3 text-white focus:ring-2 focus:ring-blue-500 outline-none">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-dark-muted mb-1">Parol</label>
                        <input type="password" x-model="form.password"
                            class="w-full bg-dark-bg border border-dark-border rounded-xl p-3 text-white focus:ring-2 focus:ring-blue-500 outline-none">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-dark-muted mb-1">Role</label>
                        <select x-model="form.role"
                            class="w-full bg-dark-bg border border-dark-border rounded-xl p-3 text-white focus:ring-2 focus:ring-blue-500 outline-none">
                            <option value="admin">Admin</option>
                            <option value="superadmin">Super Admin</option>
                        </select>
                    </div>

                    <div class="flex justify-end gap-3 pt-4">
                        <button @click="modals.form = false"
                            class="px-4 py-2 bg-dark-hover text-white rounded-xl border border-dark-border">Bekor
                            qilish</button>
                        <button @click="saveAdmin()"
                            class="px-4 py-2 bg-blue-600 hover:bg-blue-500 text-white rounded-xl shadow-lg shadow-blue-500/20">Saqlash</button>
                    </div>
                </div>
            </div>
        </div>
    </div>

</div>

<script>
    function adminsApp() {
        return {
            admins: [],
            modals: { form: false },
            form: {
                username: '',
                full_name: '',
                password: '',
                role: 'admin'
            },

            async init() {
                await this.fetchAdmins();
            },

            async fetchAdmins() {
                try {
                    const res = await fetch('/api/admins/');
                    const data = await res.json();
                    if (data.success) {
                        this.admins = data.admins;
                    }
                } catch (e) {
                    console.error(e);
                }
            },

            openModal() {
                this.form = { username: '', full_name: '', password: '', role: 'admin' };
                this.modals.form = true;
            },

            async saveAdmin() {
                if (!this.form.username || !this.form.password) return alert("Barcha maydonlarni to'ldiring");

                try {
                    const res = await fetch('/api/admins/', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(this.form)
                    });
                    const data = await res.json();

                    if (data.success) {
                        this.modals.form = false;
                        this.fetchAdmins();
                        alert("Admin qo'shildi");
                    } else {
                        alert("Xatolik: " + data.detail);
                    }
                } catch (e) {
                    alert("Server xatosi");
                }
            },

            async deleteAdmin(id) {
                if (!confirm("Adminni o'chirmoqchimisiz?")) return;
                try {
                    const res = await fetch(`/api/admins/${id}`, { method: 'DELETE' });
                    const data = await res.json();
                    if (data.success) {
                        this.fetchAdmins();
                    } else {
                        alert(data.detail);
                    }
                } catch (e) {
                    console.error(e);
                }
            }
        }
    }
</script>
{% endblock %}
