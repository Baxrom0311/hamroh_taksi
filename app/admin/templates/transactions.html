{% extends "base.html" %}

{% block title %}To'lovlar | Hamroh Admin{% endblock %}
{% block header_title %}To'lovlar Tarixi{% endblock %}

{% block content %}
<div class="space-y-6" x-data="transactionsApp()" x-init="init()">

    <!-- Stats -->
    <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
        <div class="bg-dark-card p-5 rounded-2xl shadow-lg border border-dark-border">
            <p class="text-xs text-dark-muted font-medium uppercase tracking-wider">Bugungi kirim</p>
            <p class="text-2xl font-bold text-green-400 mt-1" x-text="formatMoney(stats.today?.total || 0)"></p>
        </div>
        <div class="bg-dark-card p-5 rounded-2xl shadow-lg border border-dark-border">
            <p class="text-xs text-dark-muted font-medium uppercase tracking-wider">Haftalik kirim</p>
            <p class="text-2xl font-bold text-white mt-1" x-text="formatMoney(stats.week?.total || 0)"></p>
        </div>
        <div class="bg-dark-card p-5 rounded-2xl shadow-lg border border-dark-border">
            <p class="text-xs text-dark-muted font-medium uppercase tracking-wider">Oylik kirim</p>
            <p class="text-2xl font-bold text-white mt-1" x-text="formatMoney(stats.month?.total || 0)"></p>
        </div>
    </div>

    <!-- Filters -->
    <div
        class="bg-dark-card p-4 rounded-2xl shadow-lg border border-dark-border flex flex-wrap items-center justify-between gap-4">
        <div class="flex items-center gap-4 flex-1">
            <div class="relative flex-1 max-w-md">
                <span class="absolute inset-y-0 left-0 pl-3 flex items-center text-dark-muted">🔍</span>
                <input type="text" x-model="filters.driver_search" @input.debounce.500ms="fetchTransactions()"
                    class="block w-full pl-10 pr-3 py-2 bg-dark-bg border border-dark-border rounded-xl text-white placeholder-dark-muted focus:ring-2 focus:ring-blue-500 focus:border-blue-500 sm:text-sm transition-all"
                    placeholder="Haydovchi qidirish...">
            </div>

            <select x-model="filters.type" @change="fetchTransactions()"
                class="bg-dark-bg border border-dark-border rounded-xl px-3 py-2 text-sm text-white focus:ring-2 focus:ring-blue-500 outline-none">
                <option value="">Barcha turlar</option>
                <option value="fill_balance">Balans to'ldirish</option>
                <option value="commission">Komissiya</option>
                <option value="withdraw">Yechib olish</option>
            </select>
        </div>
        <button @click="fetchTransactions()"
            class="bg-dark-hover hover:bg-gray-700 text-white px-4 py-2 rounded-xl text-sm font-medium transition-colors border border-dark-border">
            Yangilash
        </button>
    </div>

    <!-- Transactions Table -->
    <div class="bg-dark-card rounded-2xl shadow-lg border border-dark-border overflow-hidden">
        <div class="overflow-x-auto">
            <table class="min-w-full divide-y divide-dark-border">
                <thead class="bg-dark-bg/50">
                    <tr>
                        <th class="px-6 py-4 text-left text-xs font-medium text-dark-muted uppercase tracking-wider">ID
                        </th>
                        <th class="px-6 py-4 text-left text-xs font-medium text-dark-muted uppercase tracking-wider">
                            Haydovchi</th>
                        <th class="px-6 py-4 text-left text-xs font-medium text-dark-muted uppercase tracking-wider">
                            Summa</th>
                        <th class="px-6 py-4 text-left text-xs font-medium text-dark-muted uppercase tracking-wider">Tur
                        </th>
                        <th class="px-6 py-4 text-left text-xs font-medium text-dark-muted uppercase tracking-wider">
                            Izoh</th>
                        <th class="px-6 py-4 text-left text-xs font-medium text-dark-muted uppercase tracking-wider">
                            Sana</th>
                    </tr>
                </thead>
                <tbody class="divide-y divide-dark-border">
                    <template x-for="t in transactions" :key="t.transaction_id">
                        <tr class="hover:bg-dark-hover/50 transition-colors">
                            <td class="px-6 py-4 whitespace-nowrap text-sm text-dark-muted" x-text="t.transaction_id">
                            </td>
                            <td class="px-6 py-4 whitespace-nowrap text-sm text-white font-medium"
                                x-text="t.driver_name"></td>
                            <td class="px-6 py-4 whitespace-nowrap text-sm font-mono"
                                :class="t.amount > 0 ? 'text-green-400' : 'text-red-400'"
                                x-text="(t.amount > 0 ? '+' : '') + formatMoney(t.amount)">
                            </td>
                            <td class="px-6 py-4 whitespace-nowrap text-sm">
                                <span class="px-2 inline-flex text-xs leading-5 font-semibold rounded-full" :class="{
                                          'bg-green-500/10 text-green-400': t.type === 'fill_balance',
                                          'bg-red-500/10 text-red-400': t.type === 'commission',
                                          'bg-blue-500/10 text-blue-400': t.type === 'bonus'
                                      }" x-text="getTypeName(t.type)">
                                </span>
                            </td>
                            <td class="px-6 py-4 text-sm text-dark-muted truncate max-w-xs" x-text="t.description"></td>
                            <td class="px-6 py-4 whitespace-nowrap text-sm text-dark-muted"
                                x-text="formatDate(t.created_at)"></td>
                        </tr>
                    </template>
                    <template x-if="transactions.length === 0">
                        <tr>
                            <td colspan="6" class="px-6 py-8 text-center text-dark-muted">To'lovlar topilmadi</td>
                        </tr>
                    </template>
                </tbody>
            </table>
        </div>

        <!-- Pagination -->
        <div class="px-6 py-4 bg-dark-bg/30 border-t border-dark-border flex items-center justify-between">
            <span class="text-sm text-dark-muted">Showing <span x-text="transactions.length"></span> of <span
                    x-text="total"></span></span>
            <div class="flex gap-2">
                <button @click="prevPage()" :disabled="filters.offset === 0"
                    class="px-3 py-1 border border-dark-border rounded-lg bg-dark-card text-white disabled:opacity-50 hover:bg-dark-hover transition-colors">
                    Oldingi
                </button>
                <button @click="nextPage()" :disabled="filters.offset + filters.limit >= total"
                    class="px-3 py-1 border border-dark-border rounded-lg bg-dark-card text-white disabled:opacity-50 hover:bg-dark-hover transition-colors">
                    Keyingi
                </button>
            </div>
        </div>
    </div>
</div>

<script>
    function transactionsApp() {
        return {
            transactions: [],
            stats: {},
            total: 0,
            filters: {
                driver_search: '',
                type: '',
                limit: 50,
                offset: 0
            },

            async init() {
                await this.fetchStats();
                await this.fetchTransactions();
            },

            async fetchStats() {
                const data = await this.apiCall('/api/transactions/stats');
                if (data) this.stats = data;
            },

            async fetchTransactions() {
                let url = `/api/transactions/?limit=${this.filters.limit}&offset=${this.filters.offset}`;
                if (this.filters.driver_search) url += `&driver_search=${encodeURIComponent(this.filters.driver_search)}`;
                if (this.filters.type) url += `&type=${this.filters.type}`;

                const data = await this.apiCall(url);
                if (data) {
                    this.transactions = data.transactions;
                    this.total = data.total;
                }
            },

            async apiCall(url) {
                try {
                    const res = await fetch(url);
                    return await res.json();
                } catch (e) {
                    console.error(e);
                    return null;
                }
            },

            getTypeName(type) {
                const map = {
                    'fill_balance': 'Balans to\'ldirish',
                    'commission': 'Komissiya',
                    'withdraw': 'Yechib olish',
                    'bonus': 'Bonus',
                    'penalty': 'Jarima'
                };
                return map[type] || type;
            },

            formatMoney(n) {
                return new Intl.NumberFormat('uz-UZ').format(n);
            },

            formatDate(iso) {
                if (!iso) return '-';
                return new Date(iso).toLocaleString('uz-UZ', { day: '2-digit', month: '2-digit', year: 'numeric', hour: '2-digit', minute: '2-digit' });
            },

            nextPage() {
                this.filters.offset += this.filters.limit;
                this.fetchTransactions();
            },

            prevPage() {
                this.filters.offset = Math.max(0, this.filters.offset - this.filters.limit);
                this.fetchTransactions();
            }
        }
    }
</script>
{% endblock %}
