<!DOCTYPE html>
<html lang="uz" class="dark">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hamroh Bot | Tizimga kirish</title>

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: { sans: ['Inter', 'sans-serif'] },
                    colors: {
                        dark: {
                            bg: '#0f172a',
                            card: '#1e293b',
                            border: '#334155',
                            text: '#f8fafc',
                            muted: '#94a3b8'
                        },
                        brand: { 500: '#3b82f6', 600: '#2563eb' }
                    }
                }
            }
        }
    </script>
    <style>
        .glass {
            background: rgba(30, 41, 59, 0.7);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.05);
        }
    </style>
</head>

<body class="bg-dark-bg h-screen w-full flex items-center justify-center relative overflow-hidden">

    <!-- Background Decoration -->
    <div class="absolute top-0 left-0 w-full h-full overflow-hidden z-0 pointer-events-none">
        <div class="absolute -top-[20%] -left-[10%] w-[50%] h-[50%] bg-blue-600/20 rounded-full blur-[120px]"></div>
        <div class="absolute bottom-[10%] right-[10%] w-[40%] h-[40%] bg-purple-600/20 rounded-full blur-[120px]"></div>
    </div>

    <!-- Login Card -->
    <div class="relative z-10 w-full max-w-md px-6">
        <div class="glass rounded-2xl p-8 shadow-2xl border border-dark-border/50">

            <!-- Logo -->
            <div class="text-center mb-8">
                <div
                    class="w-16 h-16 bg-gradient-to-tr from-blue-500 to-purple-600 rounded-2xl flex items-center justify-center text-4xl shadow-lg mx-auto mb-4">
                    🚕
                </div>
                <h1 class="text-2xl font-bold text-white tracking-tight">Hamroh Admin</h1>
                <p class="text-dark-muted text-sm mt-1">Boshqaruv paneliga kirish</p>
            </div>

            {% if error %}
            <div class="mb-6 p-4 rounded-xl bg-red-500/10 border border-red-500/20 flex items-start gap-3">
                <svg class="w-5 h-5 text-red-500 mt-0.5 flex-shrink-0" fill="none" viewBox="0 0 24 24"
                    stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                        d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z" />
                </svg>
                <p class="text-sm text-red-400 font-medium">{{ error }}</p>
            </div>
            {% endif %}

            <form method="post" class="space-y-5">
                <div>
                    <label
                        class="block text-xs font-medium text-dark-muted uppercase tracking-wider mb-1.5">Username</label>
                    <input type="text" name="username" required autocomplete="off"
                        class="w-full bg-dark-bg/50 border border-dark-border text-white rounded-xl px-4 py-3 focus:outline-none focus:ring-2 focus:ring-brand-500/50 focus:border-brand-500 transition-all placeholder-gray-600"
                        placeholder="admin">
                </div>

                <div>
                    <label
                        class="block text-xs font-medium text-dark-muted uppercase tracking-wider mb-1.5">Parol</label>
                    <input type="password" name="password" required
                        class="w-full bg-dark-bg/50 border border-dark-border text-white rounded-xl px-4 py-3 focus:outline-none focus:ring-2 focus:ring-brand-500/50 focus:border-brand-500 transition-all placeholder-gray-600"
                        placeholder="••••••••">
                </div>

                <button type="submit"
                    class="w-full bg-gradient-to-r from-blue-600 to-brand-600 hover:from-blue-500 hover:to-brand-500 text-white font-bold py-3.5 rounded-xl shadow-lg shadow-blue-500/25 transition-all transform hover:scale-[1.02] active:scale-[0.98]">
                    Kirish
                </button>
            </form>

            <div class="mt-8 text-center">
                <p class="text-xs text-dark-muted">
                    © 2026 Hamroh. Himoyalangan tizim.
                </p>
            </div>
        </div>
    </div>

</body>

</html>
