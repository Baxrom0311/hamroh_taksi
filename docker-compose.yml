version: '3.8'

services:
  postgres:
    image: postgis/postgis:15-3.4-alpine
    container_name: hamroh_postgres
    environment:
      POSTGRES_DB: hamroh_bot
      POSTGRES_USER: hamroh_user
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hamroh_user"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: hamroh_redis
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD}"]
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3

  bot:
    build: .
    container_name: hamroh_bot
    command: python -m app.bot.main
    depends_on:
      - postgres
      - redis
    env_file:
      - .env
    volumes:
      - ./logs:/app/logs
    restart: unless-stopped

  celery_worker:
    build: .
    container_name: hamroh_celery
    command: celery -A app.core.celery_app worker --loglevel=info --concurrency=4
    depends_on:
      - postgres
      - redis
    env_file:
      - .env
    volumes:
      - ./logs:/app/logs
    restart: unless-stopped

  celery_beat:
    build: .
    container_name: hamroh_celery_beat
    command: celery -A app.core.celery_app beat --loglevel=info
    depends_on:
      - redis
    env_file:
      - .env
    restart: unless-stopped

  flower:
    build: .
    container_name: hamroh_flower
    command: celery -A app.core.celery_app flower --port=5555 --basic_auth=user:pass
    depends_on:
      - redis
      - celery_worker
    env_file:
      - .env
    ports:
      - "5555:5555"
    restart: unless-stopped

  admin_panel:
    build: .
    container_name: hamroh_admin
    command: uvicorn app.admin.main:app --host 0.0.0.0 --port 8000
    depends_on:
      - postgres
      - redis
    env_file:
      - .env
    ports:
      - "8000:8000"
    restart: unless-stopped
    # Exposes /metrics for Prometheus scraping

  prometheus:
    image: prom/prometheus:v2.55.1
    container_name: hamroh_prometheus
    volumes:
      - ./config/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prom_data:/prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
    ports:
      - "9090:9090"
    restart: unless-stopped
    depends_on:
      - admin_panel
      - node_exporter

  grafana:
    image: grafana/grafana:11.1.2
    container_name: hamroh_grafana
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:-admin}
    volumes:
      - grafana_data:/var/lib/grafana
      - ./config/grafana/datasources:/etc/grafana/provisioning/datasources:ro
    ports:
      - "3000:3000"
    restart: unless-stopped
    depends_on:
      - prometheus

  node_exporter:
    image: prom/node-exporter:v1.8.1
    container_name: hamroh_node_exporter
    command: ["--path.rootfs=/host"]
    volumes:
      - /:/host:ro,rslave
    ports:
      - "9100:9100"
    restart: unless-stopped



volumes:
  postgres_data:
  redis_data:
  prom_data:
  grafana_data:
